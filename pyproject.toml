[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "example_package_ShotaDeguchi"
version = "0.0.4"
authors = [
    { name = "Shota Deguchi", email = "shotadeguchio2o5@gmail.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/ShotaDeguchi/ShotaDeguchi-example_package_ShotaDeguchi"
Issues = "https://github.com/ShotaDeguchi/ShotaDeguchi-example_package_ShotaDeguchi/issues"
